name: Dunelm Stock Monitor V2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test without checking Dunelm"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dunelm-stock-monitor-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.54.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check Dunelm and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: python monitor.py
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dunelm-diagnostics
          path: diagnostics/
          retention-days: 7
      - name: Save stock state
        if: success() && env.TEST_NOTIFICATION != 'true'
        env:
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Dunelm stock state"
          git push
