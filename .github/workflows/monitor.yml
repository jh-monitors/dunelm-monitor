name: Dunelm Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test without checking Dunelm"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dunelm-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Dunelm and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: python monitor.py

      - name: Save stock state
        if: success() && github.event_name != 'workflow_dispatch' || (success() && inputs.test_notification == false)
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Dunelm stock state"
          git push
